# Application Details
spring.application.name=StudentRegistrationService

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_registrations?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:anurag11am}
spring.datasource.password=${DB_PASSWORD:Anurag@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Explicit Dialect Fix for Spring Boot 3 / Hibernate 6
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# HikariCP Settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info